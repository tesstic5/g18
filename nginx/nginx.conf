# nginx/nginx.conf — reference TLS edge for a SELF-HOSTED deployment (no Dokploy/Coolify).
# NOT used by docker-compose.yml, which relies on Dokploy's Traefik for TLS. Kept as a
# starting point if you ever move off Dokploy.
#
#   443 → /api/v1/* + /socket.io/*  → api:4000  (REST + websocket)
#       → /storage/*                → minio:9000 (presigned deposit-proof URLs,
#                                        /storage prefix stripped)
#       → everything else           → web:3000  (Next.js player site + /panel)
#   80  → ACME webroot (certbot) + redirect to https
#
# Operator checklist:
#   1. Put your cert at ./certs/fullchain.pem + ./certs/privkey.pem
#      (e.g. `certbot certonly --webroot -w ./certbot-www -d yourdomain.com`
#      then copy the live/*.pem files — see the :80 server below).
#   2. Set FRONTEND_URL=https://yourdomain.com and
#      S3_PUBLIC_ENDPOINT=https://yourdomain.com/storage in the prod env.
#   3. Replace `server_name _` with your domain (cosmetic with one cert, but
#      keep it accurate for logs and future vhosts).
#
# SECURITY CONTRACT (docs/SYSTEM.md):
#   - nginx MUST NOT send Content-Security-Policy. Browsers AND all policies;
#     a static header here would undo the per-request nonce that
#     apps/web/src/proxy.ts mints. Security headers otherwise come from the
#     apps themselves (Next headers() + Fastify helmet).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time uct=$upstream_connect_time';
  # Launch URLs are short-lived bearer credentials; never retain them in access logs.
  map $request_uri $payfast_loggable {
    default 1;
    ~^/api/v1/payfast/ 0;
    ~^/api/v1/panel/payfast/ 0;
  }
  access_log /var/log/nginx/access.log main if=$payfast_loggable;

  sendfile on;
  keepalive_timeout 65;
  # Deposit proofs are ≤5MB images + multipart overhead; relay uploads ride POST.
  client_max_body_size 10m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;
  gzip_min_length 1024;

  # WebSocket upgrade detection for Socket.IO.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream web {
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }
  upstream api {
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }
  upstream minio {
    server minio:9000 max_fails=3 fail_timeout=10s;
  }

  # ── HTTP: ACME challenge + upgrade to TLS ──────────────────────────────
  server {
    listen 80 default_server;
    server_name _;

    # certbot webroot (mount ./certbot-www here when renewing)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS: the whole site ──────────────────────────────────────────────
  server {
    listen 443 ssl default_server;
    server_name _; # TODO(operator): your domain

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off; # TLS1.3 suites need no preference order
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Shared proxy headers. The API's TRUST_PROXY must cover the docker
    # network (default 10/8,172.16/12 already does) or rate limits + audit IPs
    # see nginx's IP instead of the player's.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # REST API (served by Fastify; helmet owns its security headers).
    location /api/v1/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      # Admin JSON backup restore POSTs one large body (the API raises its own
      # per-route limit with BACKUP_MAX_JSON_BYTES — default 256 MiB). nginx's
      # server-level client_max_body_size is 10m, which would reject the upload
      # with 413 before Fastify ever saw it. Keep this >= the API's limit.
      client_max_body_size 512m;
      # The restore runs as one transaction (up to RESTORE_TX_TIMEOUT_MS), so
      # the read timeout must outlast it — the old 60s killed the connection
      # mid-restore and the panel reported a timeout.
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
    }

    # Socket.IO: polling + websocket on one path. Read timeout must exceed
    # the engine.io ping cycle (25s interval / 60s timeout) or long-polls die.
    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
    }

    # Object storage for presigned deposit-proof URLs.
    # S3_PUBLIC_ENDPOINT=https://yourdomain.com/storage + path-style keys:
    #   /storage/deposit-proofs/deposits/<user>/<file> → minio /deposit-proofs/…
    location /storage/ {
      rewrite ^/storage/(.*) /$1 break;
      proxy_pass http://minio;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header X-Content-Type-Options nosniff;
      proxy_read_timeout 60s;
      # PUTs stream through; buffering a 5MB proof in nginx is pointless.
      proxy_request_buffering off;
    }

    # Everything else: Next.js (pages, /panel, thumbnails; its own rewrites
    # also proxy /api + /socket.io internally as a fallback path).
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_read_timeout 60s;
    }
  }
}
