<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.35" stop-color="#f5c842"/>
      <stop offset="0.75" stop-color="#d9a521"/>
      <stop offset="1" stop-color="#a87f12"/>
    </linearGradient>
  </defs>

  <!-- mini emblem -->
  <g transform="scale(0.72) translate(18,12)">
    <g transform="rotate(45 70 78)">
      <rect x="44" y="52" width="52" height="52" rx="6" fill="url(#gold)"/>
      <rect x="44" y="52" width="52" height="52" rx="6" fill="none" stroke="#7c5c06" stroke-width="3"/>
    </g>
    <text x="70" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="46" font-weight="900" fill="#16122a" text-anchor="middle">2</text>
  </g>

  <!-- wordmark -->
  <text x="128" y="66" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="2">2</text>
  <text x="170" y="66" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="400" fill="#ffffff" letter-spacing="3">WIN</text>
  <text x="300" y="66" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="2">2</text>
  <text x="342" y="66" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="400" fill="#ffffff" letter-spacing="3">PLAY</text>

  <!-- underline accent -->
  <rect x="128" y="82" width="300" height="5" rx="2.5" fill="url(#gold)"/>

  <!-- tagline -->
  <text x="556" y="108" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#ffffff" opacity="0.55" text-anchor="end" letter-spacing="4">PLAY · WIN · REPEAT</text>
</svg>
