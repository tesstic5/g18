<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.35" stop-color="#f5c842"/>
      <stop offset="0.75" stop-color="#d9a521"/>
      <stop offset="1" stop-color="#a87f12"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16162e"/>
      <stop offset="1" stop-color="#07070f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#f5c84222"/>
      <stop offset="1" stop-color="#f5c84200"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#halo)"/>
  <rect x="14" y="14" width="484" height="484" rx="92" fill="none" stroke="url(#goldSoft)" stroke-width="7"/>
  <rect x="30" y="30" width="452" height="452" rx="80" fill="none" stroke="#ffffff14" stroke-width="2"/>

  <!-- crown -->
  <g>
    <path d="M 196 132 L 218 90 L 246 128 L 256 96 L 266 128 L 294 90 L 316 132 L 305 168 L 207 168 Z" fill="url(#gold)"/>
    <path d="M 196 132 L 218 90 L 246 128 L 256 96 L 266 128 L 294 90 L 316 132 L 305 168 L 207 168 Z" fill="none" stroke="#8a6409" stroke-width="4"/>
    <circle cx="218" cy="90" r="9" fill="#fff8e0"/>
    <circle cx="256" cy="96" r="9" fill="#fff8e0"/>
    <circle cx="294" cy="90" r="9" fill="#fff8e0"/>
    <rect x="207" y="168" width="98" height="10" rx="4" fill="url(#gold)"/>
  </g>

  <!-- diamond -->
  <g transform="rotate(45 256 308)">
    <rect x="130" y="182" width="252" height="252" rx="18" fill="url(#gold)"/>
  </g>
  <g transform="rotate(45 256 308)">
    <rect x="130" y="182" width="252" height="252" rx="18" fill="none" stroke="#7c5c06" stroke-width="8"/>
  </g>
  <!-- diamond facet shine -->
  <g transform="rotate(45 256 308)">
    <path d="M 150 200 L 210 200 L 150 260 Z" fill="#ffffff55"/>
  </g>

  <!-- the 2 -->
  <text x="256" y="368" font-family="DejaVu Sans, Arial, sans-serif" font-size="218" font-weight="900" fill="#16122a" text-anchor="middle" letter-spacing="-6">2</text>

  <!-- sparkles -->
  <path d="M 118 118 l 7 16 l 16 7 l -16 7 l -7 16 l -7 -16 l -16 -7 l 16 -7 Z" fill="#fff" opacity="0.95"/>
  <path d="M 392 176 l 5 12 l 12 5 l -12 5 l -5 12 l -5 -12 l -12 -5 l 12 -5 Z" fill="#fff" opacity="0.7"/>
  <path d="M 372 430 l 4 9 l 9 4 l -9 4 l -4 9 l -4 -9 l -9 -4 l 9 -4 Z" fill="#fff" opacity="0.45"/>
</svg>
